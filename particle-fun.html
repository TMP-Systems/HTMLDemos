<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML5 Interactive Neon Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Glassmorphism UI Overlay */
    .ui-card {
      position: relative;
      z-index: 2;
      max-width: 420px;
      margin: 30px;
      padding: 24px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    button:active {
      transform: translateY(0);
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 14px;
      width: 100%;
    }

    input[type="range"] {
      accent-color: #38bdf8;
      margin-top: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="ui-card">
    <h1>HTML5 + Canvas Magic</h1>
    <p>Move your cursor to weave a glowing web. Click anywhere on the screen to spawn new bursts of energy!</p>
    <div class="controls">
      <button id="burstBtn">Supernova Burst</button>
      <button id="colorBtn">Shift Palette</button>
    </div>
    <div class="slider-group">
      <label for="speedSlider">Particle Speed</label>
      <input type="range" id="speedSlider" min="0.2" max="4" step="0.1" value="1.2" />
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const speedSlider = document.getElementById('speedSlider');
    const burstBtn = document.getElementById('burstBtn');
    const colorBtn = document.getElementById('colorBtn');

    let width, height;
    let particles = [];
    let hueOffset = 0;

    const mouse = { x: null, y: null, radius: 150 };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    window.addEventListener('mouseout', () => {
      mouse.x = null;
      mouse.y = null;
    });

    window.addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
        spawnBurst(e.clientX, e.clientY, 18);
      }
    });

    class Particle {
      constructor(x, y, isBurst = false) {
        this.x = x || Math.random() * width;
        this.y = y || Math.random() * height;
        this.size = Math.random() * 3 + 1.5;
        const angle = Math.random() * Math.PI * 2;
        const velocity = isBurst ? Math.random() * 5 + 2 : Math.random() * 1.5 + 0.5;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity;
        this.baseHue = Math.random() * 60 + 180; // Cyan to purple range
      }

      update(speedMultiplier) {
        this.x += this.vx * speedMultiplier;
        this.y += this.vy * speedMultiplier;

        // Bounce off edges
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        // Gentle attraction to mouse
        if (mouse.x !== null && mouse.y !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.hypot(dx, dy);
          if (dist < mouse.radius && dist > 5) {
            this.x += dx * 0.02;
            this.y += dy * 0.02;
          }
        }
      }

      draw() {
        const hue = (this.baseHue + hueOffset) % 360;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsl(${hue}, 100%, 65%)`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function init() {
      particles = [];
      const count = Math.min(110, Math.floor((width * height) / 11000));
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function spawnBurst(x, y, amount) {
      for (let i = 0; i < amount; i++) {
        particles.push(new Particle(x, y, true));
      }
      if (particles.length > 220) {
        particles.splice(0, particles.length - 220);
      }
    }

    function connectParticles() {
      for (let a = 0; a < particles.length; a++) {
        for (let b = a + 1; b < particles.length; b++) {
          const dx = particles[a].x - particles[b].x;
          const dy = particles[a].y - particles[b].y;
          const dist = Math.hypot(dx, dy);

          if (dist < 120) {
            const opacity = 1 - dist / 120;
            const hue = (particles[a].baseHue + hueOffset) % 360;
            ctx.strokeStyle = `hsla(${hue}, 100%, 65%, ${opacity * 0.6})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(2, 6, 23, 0.25)'; // Creates smooth motion trails
      ctx.fillRect(0, 0, width, height);

      const speed = parseFloat(speedSlider.value);

      particles.forEach((p) => {
        p.update(speed);
        p.draw();
      });

      connectParticles();
      requestAnimationFrame(animate);
    }

    burstBtn.addEventListener('click', () => {
      spawnBurst(width / 2, height / 2, 35);
    });

    colorBtn.addEventListener('click', () => {
      hueOffset = (hueOffset + 75) % 360;
    });

    init();
    animate();
  </script>
</body>
</html>
