<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Ring Loader Demo</title>
  <style>
    /* Center the loader on a dark background */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #1a1a1a;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Create a spinning loader with a glowing dot that circles the edge. */
    .ring {
      position: relative;
      width: 150px;
      height: 150px;
      border: 3px solid #3c3c3c;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }

    .ring::before {
      content: "";
      position: absolute;
      top: -3px;
      left: -3px;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-top: 3px solid #34b9ed;
      border-right: 3px solid #34b9ed;
      border-radius: 50%;
      animation: rotate-arc 2s linear infinite;
    }

    .ring span {
      display: block;
      position: absolute;
      top: calc(50% - 2px);
      left: 50%;
      width: 50%;
      height: 4px;
      transform-origin: left;
      animation: rotate-comet 2s linear infinite;
    }

    .ring span::before {
      content: "";
      position: absolute;
      top: -6px;
      right: -8px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #34b9ed;
      box-shadow: 0 0 20px #34b9ed;
    }

    @keyframes rotate-arc {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes rotate-comet {
      from {
        transform: rotate(45deg);
      }
      to {
        transform: rotate(405deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      /* Stop the animation and keep the loader visible. */
      .ring::before,
      .ring span {
        animation: none;
      }
    }
  </style>
</head>
<body>

  <div class="ring" role="status" aria-label="Loading">
    <span></span>
  </div>

</body>
</html>
