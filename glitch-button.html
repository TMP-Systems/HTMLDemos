<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glitch Jitter Button Demo</title>
  <style>
    /* Basic page centering and dark background for contrast */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Your Button Styles */
    .glitch-jitter-btn {
      position: relative;
      padding: 0.75rem 2rem;
      background: #0f0;
      color: #000;
      border: none;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 6px 2px #00ff00aa;
      transition: transform 0.1s;
    }

    /* keyframes = sideways jerk + triple glow */
    @keyframes jitter {
      0% {
        transform: translate(0, 0);
        box-shadow: 0 0 6px 2px #00ff00aa;
      }
      25% {
        transform: translate(-1px, 1px);
        box-shadow: 2px -2px 4px #00ff00aa, -2px 2px 4px #00ff00aa;
      }
      50% {
        transform: translate(1px, -1px);
        box-shadow: -2px 2px 4px #00ff00aa, 2px -2px 4px #00ff00aa;
      }
      75% {
        transform: translate(-1px, 1px);
        box-shadow: 2px 2px 4px #00ff00aa, -2px -2px 4px #00ff00aa;
      }
      100% {
        transform: translate(0, 0);
        box-shadow: 0 0 6px 2px #00ff00aa;
      }
    }

    /* JS toggles the helper class */
    .glitch-fire {
      animation: jitter 0.12s steps(1) forwards;
    }

    /* accessibility: give keyboard users parity */
    .glitch-jitter-btn:focus-visible {
      outline: 3px solid #00ff00aa;
      outline-offset: 4px;
    }
  </style>
</head>
<body>

  <button class="glitch-jitter-btn" type="button">CLICK TO GLITCH</button>
  <p style="font-size: 0.875rem; opacity: 0.7;">Click the button or focus it with Tab and press Enter/Space</p>

  <script>
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.glitch-jitter-btn');
      if (!btn) return;
      
      btn.classList.remove('glitch-fire');
      void btn.offsetWidth; // force reflow
      btn.classList.add('glitch-fire');
    });
  </script>

</body>
</html>
