<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fade-In-Up Card Demo</title>
  <style>
    /* Basic page layout to center the demo */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background-color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1f2937;
    }

    /* Visual styling for the card */
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      max-width: 360px;
      width: 90%;

      /* --- YOUR ANIMATION CODE --- */
      opacity: 0;
      transform: translateY(16px);
      animation: fade-in-up 800ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.25rem;
    }

    .card p {
      margin: 0;
      line-height: 1.5;
      color: #4b5563;
    }

    @keyframes fade-in-up {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      /* Skip the animation and show the card immediately. */
      .card {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }

    /* Button styling to replay the effect */
    button {
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 150ms ease;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="card" id="demo-card">
    <h2>Welcome Back</h2>
    <p>This card fades in and slides up smoothly using your custom cubic-bezier easing curve.</p>
  </div>

  <button type="button" onclick="replayAnimation()">Replay Animation</button>

  <script>
    function replayAnimation() {
      const card = document.getElementById('demo-card');
      // Remove and re-add the class to restart the CSS animation
      card.classList.remove('card');
      void card.offsetWidth; // Trigger a browser reflow
      card.classList.add('card');
    }
  </script>

</body>
</html>
