<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow Link Hover Demo</title>
  <style>
    /* Basic dark background so the cyan (#0ff) link stands out */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1.5rem;
    }

    /* Your formatted CSS */
    a.glow-link {
      position: relative;
      color: #0ff;
      text-decoration: none;
      padding-bottom: 4px; /* Added slight padding so the underline sits cleanly below the text */
    }

    a.glow-link::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 0;
      height: 2px;
      background: currentColor;
      transition: width 0.25s ease, left 0.25s ease;
    }

    a.glow-link:hover::after,
    a.glow-link:focus-visible::after {
      width: 100%;
      left: 0;
    }
  </style>
</head>
<body>

  <a href="#home" class="glow-link">Home</a>
  <a href="#projects" class="glow-link">Projects</a>
  <a href="#contact" class="glow-link">Contact</a>

</body>
</html>
